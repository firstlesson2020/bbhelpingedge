name: Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'aws-static-site/infra/**'
      - '.github/workflows/terraform-infra.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    environment: prod

    defaults:
      run:
        working-directory: aws-static-site/infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.4

      - name: Terraform Init
        run: terraform init

      - name: Import existing AWS resources into state
        shell: bash
        run: |
          set -e

          if aws s3api head-bucket --bucket "bbhelpingedge.org" >/dev/null 2>&1; then
            echo "Bucket already exists; importing into Terraform state..."
            terraform import aws_s3_bucket.site "bbhelpingedge.org" || true
          fi

          zone_id=$(aws route53 list-hosted-zones-by-name --dns-name "bbhelpingedge.org" --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)
          if [ -n "$zone_id" ] && [ "$zone_id" != "None" ]; then
            zone_id="${zone_id#/hostedzone/}"
            echo "Hosted zone already exists; importing into Terraform state..."
            terraform import aws_route53_zone.primary "$zone_id" || true
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
