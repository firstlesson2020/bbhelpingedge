name: Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'aws-static-site/infra/**'
      - '.github/workflows/terraform-infra.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    environment: prod

    defaults:
      run:
        working-directory: aws-static-site/infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.4

      - name: Terraform Init
        run: terraform init

      - name: Import existing AWS resources into state
        shell: bash
        run: |
          set -e

          if aws s3api head-bucket --bucket "bbhelpingedge.org" >/dev/null 2>&1; then
            echo "Bucket already exists; importing into Terraform state..."
            terraform import aws_s3_bucket.site "bbhelpingedge.org" || true
          fi

          oac_id=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='bbhelpingedge.org-oac'].Id | [0]" --output text 2>/dev/null || true)
          if [ -n "$oac_id" ] && [ "$oac_id" != "None" ]; then
            echo "Origin access control already exists; importing into Terraform state..."
            terraform import aws_cloudfront_origin_access_control.site "$oac_id" || true
          fi

          distribution_id=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?DomainName=='bbhelpingedge.org.s3.amazonaws.com']].Id | [0]" --output text 2>/dev/null || true)
          if [ -n "$distribution_id" ] && [ "$distribution_id" != "None" ]; then
            echo "CloudFront distribution already exists; importing into Terraform state..."
            terraform import aws_cloudfront_distribution.site "$distribution_id" || true
          fi

          zone_id=$(aws route53 list-hosted-zones-by-name --dns-name "bbhelpingedge.org" --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)
          if [ -n "$zone_id" ] && [ "$zone_id" != "None" ]; then
            zone_id="${zone_id#/hostedzone/}"
            echo "Hosted zone already exists; importing into Terraform state..."
            terraform import aws_route53_zone.primary "$zone_id" || true
          fi

          existing_record_id=$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id:-$(aws route53 list-hosted-zones-by-name --dns-name 'bbhelpingedge.org' --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)}" --query "ResourceRecordSets[?Name=='bbhelpingedge.org.' && Type=='A'].Name | [0]" --output text 2>/dev/null || true)
          if [ -n "$existing_record_id" ] && [ "$existing_record_id" != "None" ]; then
            echo "A record already exists; importing into Terraform state..."
            terraform import aws_route53_record.apex "${zone_id:-$(aws route53 list-hosted-zones-by-name --dns-name 'bbhelpingedge.org' --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)}_bbhelpingedge.org_A" || true
          fi

          existing_aaaa_record_id=$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id:-$(aws route53 list-hosted-zones-by-name --dns-name 'bbhelpingedge.org' --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)}" --query "ResourceRecordSets[?Name=='bbhelpingedge.org.' && Type=='AAAA'].Name | [0]" --output text 2>/dev/null || true)
          if [ -n "$existing_aaaa_record_id" ] && [ "$existing_aaaa_record_id" != "None" ]; then
            echo "AAAA record already exists; importing into Terraform state..."
            terraform import aws_route53_record.apex_aaaa "${zone_id:-$(aws route53 list-hosted-zones-by-name --dns-name 'bbhelpingedge.org' --max-items 1 --query 'HostedZones[0].Id' --output text 2>/dev/null || true)}_bbhelpingedge.org_AAAA" || true
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
